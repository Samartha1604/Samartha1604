<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Samartha Padwekar</title>
  <desc id="bannerDesc">Second-year B.E. Computer Science and Engineering student. Developer, problem solver, lifelong learner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="0.55" stop-color="#0F1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="72" y1="120" x2="700" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="ringGradient" x1="925" y1="72" x2="1085" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1020 140) rotate(90) scale(220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(120 320) rotate(-45) scale(260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.035" fill="none"/>
    </pattern>
  </defs>

  <clipPath id="cardClip">
    <rect width="1200" height="300" rx="28"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#violetGlow)"/>
    <rect width="1200" height="300" fill="url(#cyanGlow)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="1020" cy="140" r="150" fill="none" stroke="#8B5CF6" stroke-opacity="0.07"/>
    <circle cx="1020" cy="140" r="190" fill="none" stroke="#22D3EE" stroke-opacity="0.05"/>

    <g font-family="Consolas, 'Courier New', monospace">
      <circle cx="76" cy="73" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="90" y="79" fill="#A78BFA" font-size="15" letter-spacing="5">// HELLO, WORLD</text>
    </g>

    <text x="72" y="157" fill="url(#nameGradient)" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Samartha Padwekar</text>

    <text x="74" y="198" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22">Second-Year B.E. Computer Science &amp; Engineering</text>

    <g font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="72" y="222" width="120" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4"/>
      <text x="132" y="246" text-anchor="middle" fill="#C4B5FD">Developer</text>

      <rect x="202" y="222" width="152" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4"/>
      <text x="278" y="246" text-anchor="middle" fill="#C4B5FD">Problem Solver</text>

      <rect x="364" y="222" width="166" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4"/>
      <text x="447" y="246" text-anchor="middle" fill="#C4B5FD">Lifelong Learner</text>
    </g>

    <text x="72" y="281" fill="#475569" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3.5">BUILD  •  LEARN  •  SHARE</text>

    <g>
      <circle cx="1005" cy="150" r="78" fill="#0F172A" stroke="url(#ringGradient)" stroke-width="2" stroke-opacity="0.85"/>
      <circle cx="1005" cy="150" r="94" fill="none" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 10">
        <animateTransform attributeName="transform" type="rotate" from="0 1005 150" to="360 1005 150" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1005" cy="150" r="112" fill="none" stroke="#22D3EE" stroke-opacity="0.13" stroke-width="1"/>
      <text x="1005" y="172" text-anchor="middle" fill="url(#ringGradient)" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">SP</text>

      <circle cx="1087" cy="96" r="5" fill="#22D3EE">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="927" cy="216" r="4" fill="#8B5CF6">
        <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1105" cy="196" r="2.5" fill="#A78BFA" opacity="0.7">
        <animate attributeName="cy" values="196;190;196" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="1128" y="281" text-anchor="end" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="12">github.com/Samartha1604</text>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>
</svg>
